<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required Meta Tags -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Optional: preconnect important origins (inject script can add these if preferred) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preconnect" href="https://static.sketchfab.com" crossorigin>
    <link rel="preconnect" href="https://amora-mx7x.onrender.com" crossorigin>

    <!-- Preload hero image + critical font (keep one LCP preload) -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1621784563330-caee0b138a00?auto=format&fit=crop&w=1000&q=80">
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Primary SEO -->
    <title>Amora | Smart College Dating & Compatibility App</title>
    <meta name="description" content="Find your perfect college match with Amora — a smart compatibility-based dating platform that connects students using personality analysis and emotional intelligence." />
    <meta name="keywords" content="dating app, college dating, compatibility match, personality-based dating, emotional intelligence, Amora" />
    <meta name="author" content="Kashish Yadav" />
    <link rel="canonical" href="https://www.amoraonline.in" />
  
    <!-- === Tiny critical CSS (only above-the-fold / hero rules) === -->
    <style>
      /* Keep this very small — only what the hero/above-the-fold needs */
      :root { background-color: black; }
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
      .hero, #root { min-height: 80vh; display: block; }
      /* minimal hero layout rules only */
    </style>

    <!-- CSS_PRELOAD_PLACEHOLDER: inject-css.js will replace this with non-blocking CSS preload + modulepreload entries -->
    <!-- CSS_PRELOAD_PLACEHOLDER -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://www.amoraonline.in/images/image.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://www.amoraonline.in/images/image.png" />
    <link rel="apple-touch-icon" href="https://www.amoraonline.in/images/image.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Amora — College Dating Made Smart" />
    <meta property="og:description" content="A next-gen dating app that matches students based on emotional intelligence and personality compatibility." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.amoraonline.in" />
    <meta property="og:image" content="https://www.amoraonline.in/images/image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amora — Smart College Dating" />
    <meta name="twitter:description" content="Find your perfect match with AI-based personality compatibility on Amora." />
    <meta name="twitter:image" content="https://www.amoraonline.in/images/image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Amora",
      "url": "https://www.amoraonline.in",
      "description": "Smart college dating app that matches students using personality compatibility and emotional intelligence.",
      "applicationCategory": "DatingApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "Kashish Yadav"
      },
      "screenshot": "https://www.amoraonline.in/images/image.png"
    }
    </script>

    <!-- IMPORTANT: do not hardcode built hashes here; inject-css.js will add modulepreload tags for built entries -->
  </head>

  <body>
    <div id="root"></div>

    <!-- Main app (module scripts are deferred by default; Vite will map /src/main.jsx to hashed bundles in production) -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Lazy-load Sketchfab after load or on first user interaction -->
    <script>
      (function loadSketchfabWhenIdle() {
        var sketchfabUrl = "https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js";
        var loaded = false;
        function insertScript() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = sketchfabUrl;
          s.defer = true;
          document.body.appendChild(s);
        }
        // Prefer after window load + small delay
        window.addEventListener('load', function() {
          // give LCP a tiny breathing room
          setTimeout(insertScript, 250);
        }, {passive:true});
        // Or on first user interaction (whichever comes first)
        ['scroll','keydown','pointerdown','touchstart'].forEach(function(ev){
          window.addEventListener(ev, insertScript, {once:true, passive:true});
        });
      })();
    </script>
  </body>
</html>
